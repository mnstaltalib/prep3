<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطالب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // إعدادات Tailwind
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } }
        }

        // --- كود منع الوميض (يجب أن يكون هنا في الرأس) ---
        // يتحقق فوراً قبل تحميل الصفحة
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
<style>
    /* نطبق الانميشن على المحتوى الرئيسي فقط وليس الصفحة كلها */
    main {
        animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; /* يبدأ مخفي */
        transform: translateY(20px); /* يبدأ من الأسفل قليلاً */
    }

    @keyframes slideUpFade {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* كلاسات مساعدة أخرى */
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .fade-out { animation: fadeOut 0.3s ease-in forwards; }
    .expand-wrapper { max-height: 0; overflow: hidden; transition: all 0.5s; }
    .expand-wrapper.open { max-height: 1000px; }
</style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-neutral-900 dark:text-neutral-100 transition-colors duration-300 flex flex-col min-h-screen text-sm md:text-base">

    <div id="navbar-container"></div>

    <main class="flex-grow container mx-auto px-4 py-8 md:py-12">
        
        <header class="text-center mb-8 md:mb-12">
            <h1 class="text-3xl md:text-6xl font-bold mb-4 text-blue-600 dark:text-blue-400">مرحباً بك في منصة الطالب</h1>
            
            <p class="text-lg md:text-xl text-gray-600 dark:text-neutral-400 md:mt-6">طريقك نحو التفوق الدراسي.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 max-w-5xl mx-auto">
            
            <a href="library.html" class="group block p-6 md:p-8 bg-white dark:bg-neutral-800 rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 border-b-4 border-blue-500">
                <div class="text-center">
                    <i class="fa-solid fa-book-open text-4xl md:text-5xl mb-4 text-blue-500 group-hover:scale-110 transition-transform"></i>
                    <h2 class="text-xl md:text-2xl font-bold mb-2">المكتبة الرقمية</h2>
                    <p class="text-gray-500 dark:text-neutral-400 text-xs md:text-sm">شروحات، ملخصات، وكتب.</p>
                </div>
            </a>

            <a href="questions.html" class="group block p-6 md:p-8 bg-white dark:bg-neutral-800 rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 border-b-4 border-green-500">
                <div class="text-center">
                    <i class="fa-solid fa-circle-question text-4xl md:text-5xl mb-4 text-green-500 group-hover:scale-110 transition-transform"></i>
                    <h2 class="text-xl md:text-2xl font-bold mb-2">بنك الأسئلة</h2>
                    <p class="text-gray-500 dark:text-neutral-400 text-xs md:text-sm">تدريبات مكثفة للمستويات.</p>
                </div>
            </a>

            <a href="capsule.html" class="group block p-6 md:p-8 bg-white dark:bg-neutral-800 rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 border-b-4 border-yellow-500">
                <div class="text-center">
                    <i class="fa-solid fa-lightbulb text-4xl md:text-5xl mb-4 text-yellow-500 group-hover:scale-110 transition-transform"></i>
                    <h2 class="text-xl md:text-2xl font-bold mb-2">كبسولة المنهج</h2>
                    <p class="text-gray-500 dark:text-neutral-400 text-xs md:text-sm">المراجعة النهائية.</p>
                </div>
            </a>

            <a href="quizzes.html" class="group block p-6 md:p-8 bg-white dark:bg-neutral-800 rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 border-b-4 border-red-500 col-span-1 md:col-span-2 lg:col-span-3">
                <div class="text-center flex flex-col items-center justify-center">
                    <i class="fa-solid fa-clipboard-check text-4xl md:text-5xl mb-4 text-red-500 group-hover:scale-110 transition-transform"></i>
                    <h2 class="text-xl md:text-2xl font-bold mb-2">الاختبارات الإلكترونية</h2>
                    <p class="text-gray-500 dark:text-neutral-400 text-xs md:text-sm">اختبر نفسك واحصل على النتيجة.</p>
                </div>
            </a>

        </div>
    </main>

    <div id="footer-container"></div>

    <script src="layout.js"></script>
</body>
</html>
