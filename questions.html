<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك الأسئلة - منصة الطالب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] } } }
        }
        
        // منع وميض الوضع الليلي
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <style>
        /* --- تخصيص شريط التمرير (Scrollbar) --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dark ::-webkit-scrollbar-track { background: #171717; }
        .dark ::-webkit-scrollbar-thumb { background: #404040; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #525252; }

        /* --- الانميشن الموحد (Slide Up Fade) --- */
        main { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* انميشن العناصر الداخلية */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .fade-out { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* انميشن التمدد للإجابة */
        .expand-wrapper { max-height: 0; overflow: hidden; opacity: 0; transform: translateY(-10px); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .expand-wrapper.open { max-height: 800px; opacity: 1; transform: translateY(0); }

        /* انميشن زر التالي */
        .btn-appear { animation: btnSlideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes btnSlideIn { from { opacity: 0; transform: scale(0.5) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* --- تنسيق الخط تحت الكلمات في القطعة (إن وجدت مستقبلاً) --- */
        #activeQuestionContainer u {
            text-decoration: underline;
            text-decoration-color: #ef4444;
            text-underline-offset: 5px;
            text-decoration-thickness: 2px;
            font-weight: 700;
        }
    </style>
</head>

    <div id="navbar-container"></div>

    <main class="flex-grow container mx-auto px-4 py-4 md:py-12">
        
        <div id="moduleLockedScreen" class="hidden max-w-2xl mx-auto text-center py-20 bg-white dark:bg-neutral-800 rounded-3xl shadow-xl border dark:border-neutral-700">

                        <div id="resProgressBar" style="width:0%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-blue-500 transition-all duration-1000"></div>

            <button onclick="resetSetup()" class="bg-gray-800 hover:bg-gray-900 text-white px-8 py-3 rounded-xl font-bold shadow transition-transform hover:-translate-y-1 text-[13px] md:text-base">

    <div id="footer-container"></div>

    <script>
        window.questionsData = []; 

        window.addSubjectQuestions = function(subjectName, rawData) {
            const formattedData = rawData.map(item => {
                if (item[1] === 'mcq') {
                    return { id: item[0], subject: subjectName, type: 'mcq', lesson: item[2], question: item[3], options: item[4], correctAnswer: item[5] };
                } else if (item[1] === 'essay') {
                    return { id: item[0], subject: subjectName, type: 'essay', lesson: item[2], question: item[3], correctAnswer: item[4] };
                }
                return null;
            });
            window.questionsData = window.questionsData.concat(formattedData.filter(q => q !== null));
        };
    </script>

    <script src="data/questions/arabic.js"></script>
    <script src="layout.js"></script>

    <script>
        const systemConfig = {
            isModuleLocked: false, 
            moduleLockMessage: "نعتذر، بنك الأسئلة يخضع للتحديثات حالياً. يرجى العودة لاحقاً.",
            subjects: {
                'عربي': {
                    locked: false, lockMessage: "مادة اللغة العربية مغلقة مؤقتاً.",
                    grading: { excellent: 50, passing: 30, incomplete: 15 },
                    types: { mcq: { locked: false, message: "الاختياري مغلق حالياً." }, essay: { locked: false, message: "المقالي مغلق للتصحيح." } }
                },
                'علوم': { locked: false, lockMessage: "مادة العلوم مغلقة.", grading: { excellent: 50, passing: 30, incomplete: 15 }, types: { mcq: { locked: false, message: "" }, essay: { locked: false, message: "" } } },
                'دراسات': { locked: false, lockMessage: "", grading: { excellent: 50, passing: 30, incomplete: 15 }, types: { mcq: { locked: false }, essay: { locked: false } } },
                'رياضيات': { locked: false, lockMessage: "", grading: { excellent: 50, passing: 30, incomplete: 15 }, types: { mcq: { locked: false }, essay: { locked: false } } },
                'انجليزي': { locked: false, lockMessage: "", grading: { excellent: 50, passing: 30, incomplete: 15 }, types: { mcq: { locked: false }, essay: { locked: false } } }
            }
        };

        let appState = { currentSubject: null, currentType: null, questionsQueue: [], currentIndex: 0, stats: { correct: 0, wrong: 0, totalAnswered: 0 } };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct' || type === 'excellent') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'acceptable') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong' || type === 'incomplete') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'tick') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (systemConfig.isModuleLocked) {
                document.getElementById('setupWizard').classList.add('hidden');
                const lockScreen = document.getElementById('moduleLockedScreen');
                document.getElementById('moduleLockMessage').innerText = systemConfig.moduleLockMessage;
                lockScreen.classList.remove('hidden');
                lockScreen.classList.add('fade-in');
            }
        });

        function calculateSimilarity(str1, str2) {
            const clean = (str) => str.toLowerCase().replace(/[^\u0621-\u064A0-9a-z\s]/g, '').replace(/\s+/g, ' ').trim();
            const s1 = clean(str1), s2 = clean(str2);
            if (s1 === s2) return 1; if (s1.length < 2 || s2.length < 2) return 0;
            const getBigrams = (str) => {
                const bigrams = new Map();
                for (let i = 0; i < str.length - 1; i++) {
                    const bigram = str.substring(i, i + 2);
                    bigrams.set(bigram, (bigrams.get(bigram) || 0) + 1);
                }
                return bigrams;
            };
            const bigrams1 = getBigrams(s1), bigrams2 = getBigrams(s2);
            let intersection = 0;
            for (const [key, val] of bigrams1) { if (bigrams2.has(key)) intersection += Math.min(val, bigrams2.get(key)); }
            return (2 * intersection) / ((s1.length - 1) + (s2.length - 1));
        }

        function transitionStep(currentId, nextId) {
            const current = document.getElementById(currentId);
            const next = document.getElementById(nextId);
            current.classList.add('fade-out');
            setTimeout(() => {
                current.classList.add('hidden'); current.classList.remove('fade-out');
                next.classList.remove('hidden'); next.classList.add('fade-in');
            }, 300);
        }

        function selectSubject(subject) {
            const config = systemConfig.subjects[subject];
            if (config && config.locked) { alert("🔒 " + config.lockMessage); return; }
            appState.currentSubject = subject;
            updateTypeButtons(subject);
            transitionStep('stepSubject', 'stepType');
        }

        function updateTypeButtons(subject) {
            const config = systemConfig.subjects[subject];
            const types = ['mcq', 'essay'];
            
            types.forEach(type => {
                const btn = document.getElementById(`btn-${type}`);
                if (!btn) return;

                btn.disabled = false;
                btn.className = 'p-6 md:p-8 border-2 border-dashed rounded-xl transition-all group relative overflow-hidden ' + 
                    (type === 'mcq' ? 'border-blue-300 dark:border-blue-700 hover:bg-blue-50 dark:hover:bg-neutral-700' : 'border-green-300 dark:border-green-700 hover:bg-green-50 dark:hover:bg-neutral-700');
                
                if (type === 'mcq') {
                    btn.innerHTML = `<div class="content-wrapper"><i class="fa-solid fa-list-check text-3xl md:text-4xl text-blue-500 mb-4 group-hover:scale-110 transition-transform block mx-auto"></i><h3 class="text-[14px] md:text-xl font-bold">أسئلة اختيارية</h3><p class="text-[11px] md:text-sm text-gray-500 mt-2">اختبر نفسك بسرعة</p></div>`;
                } else {
                    btn.innerHTML = `<div class="content-wrapper"><i class="fa-solid fa-pen-nib text-3xl md:text-4xl text-green-500 mb-4 group-hover:scale-110 transition-transform block mx-auto"></i><h3 class="text-[14px] md:text-xl font-bold">أسئلة مقالية</h3><p class="text-[11px] md:text-sm text-gray-500 mt-2">اكتب إجابتك وسنصححها لك</p></div>`;
                }

                if (config.types[type] && config.types[type].locked) {
                    btn.disabled = true;
                    btn.className = 'p-6 md:p-8 border-2 border-dashed border-gray-300 dark:border-neutral-600 bg-gray-50 dark:bg-neutral-800 rounded-xl cursor-not-allowed opacity-70';
                    btn.innerHTML = `
                        <div class="content-wrapper">
                            <i class="fa-solid fa-lock text-3xl md:text-4xl text-gray-400 mb-4 block mx-auto"></i>
                            <h3 class="text-[14px] md:text-xl font-bold text-gray-500">مغلق مؤقتاً</h3>
                            <p class="text-[11px] md:text-sm text-gray-400 mt-2">${config.types[type].message}</p>
                        </div>
                    `;
                }
            });
        }

        function selectType(type) { 
            appState.currentType = type; 
            renderLessons(appState.currentSubject, type); 
            transitionStep('stepType', 'stepLesson'); 
        }

        function backToStep(targetId) {
            ['stepSubject', 'stepType', 'stepLesson'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(targetId).classList.remove('hidden'); document.getElementById(targetId).classList.add('fade-in');
        }

        function renderLessons(subject, type) {
            const container = document.getElementById('lessonsContainer'); container.innerHTML = '';
            const filteredQuestions = window.questionsData.filter(q => q.subject === subject && q.type === type);
            const lessons = new Set(filteredQuestions.map(q => q.lesson));
            if (lessons.size === 0) { container.innerHTML = '<p class="text-red-500 col-span-2 text-center text-[13px] md:text-base">لا توجد أسئلة متاحة لهذه المادة.</p>'; return; }
            lessons.forEach(lesson => {
                const div = document.createElement('div');
                div.className = 'flex items-center bg-gray-50 dark:bg-neutral-900 p-3 rounded-lg border border-gray-200 dark:border-neutral-700';
                div.innerHTML = `<input type="checkbox" value="${lesson}" class="lesson-checkbox w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer"><span class="mr-3 text-gray-700 dark:text-neutral-300 font-medium text-[13px] md:text-base">${lesson}</span>`;
                container.appendChild(div);
            });
            const selectAllBtn = document.getElementById('selectAll'); selectAllBtn.checked = false;
            selectAllBtn.onclick = function() { document.querySelectorAll('.lesson-checkbox').forEach(cb => cb.checked = this.checked); };
        }

        function resetSetup() {
            ['quizArea', 'resultsArea', 'stepType', 'stepLesson'].forEach(id => document.getElementById(id).classList.add('hidden'));
            const stepSubject = document.getElementById('stepSubject');
            stepSubject.classList.remove('hidden'); stepSubject.classList.add('fade-in');
            document.getElementById('setupWizard').classList.remove('hidden');
            appState = { ...appState, currentIndex: 0, stats: { correct: 0, wrong: 0, totalAnswered: 0 } };
        }

        function startQuiz() {
            const checkboxes = document.querySelectorAll('.lesson-checkbox:checked');
            const selectedLessons = Array.from(checkboxes).map(cb => cb.value);
            if (selectedLessons.length === 0) { alert('المرجو اختيار درس واحد على الأقل!'); return; }
            let filteredQuestions = window.questionsData.filter(q => q.subject === appState.currentSubject && q.type === appState.currentType && selectedLessons.includes(q.lesson));
            appState.questionsQueue = shuffleArray(filteredQuestions);
            appState.totalQuestions = filteredQuestions.length;
            if (appState.totalQuestions === 0) return;
            document.getElementById('setupWizard').classList.add('hidden'); document.getElementById('quizArea').classList.remove('hidden');
            document.getElementById('subjectNameBadge').innerText = appState.currentSubject;
            document.getElementById('qTotal').innerText = appState.totalQuestions;
            showQuestion(0);
        }

        function showQuestion(index) {
            const q = appState.questionsQueue[index];
            appState.currentIndex = index;
            document.getElementById('qCurrent').innerText = index + 1;
            
            const nextWrapper = document.getElementById('nextBtnWrapper');
            nextWrapper.classList.add('hidden');
            
            let qLength = q.question.length;
            let qSizeClass = qLength > 150 ? "text-[13px] md:text-lg" : (qLength > 70 ? "text-[14px] md:text-xl" : "text-[16px] md:text-2xl");

            const container = document.getElementById('activeQuestionContainer');
            container.innerHTML = `
                <div class="mb-4 text-[10px] md:text-xs text-gray-400 font-bold"><i class="fa-solid fa-layer-group ml-1"></i> ${q.lesson}</div>
                <h3 class="font-bold mb-4 md:mb-8 leading-relaxed text-gray-900 dark:text-neutral-100 transition-all duration-300 text-center ${qSizeClass} fade-in">${q.question}</h3>
                <div id="interactionArea" class="fade-in">${getInteractionHTML(q)}</div>
                <div id="feedbackWrapper" class="expand-wrapper mt-6">
                    <div id="feedbackContent"></div>
                </div>
            `;
            
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.classList.remove('btn-appear');
        }

        function getInteractionHTML(q) {
            if (q.type === 'mcq') {
                return `<div class="grid grid-cols-1 gap-2 md:gap-3">${q.options.map((opt, i) => {
                    let optLength = opt.length;
                    let optSize = optLength > 60 ? "text-[11px] md:text-[14px]" : "text-[12px] md:text-base";
                    return `<button onclick="handleAnswer('mcq', ${i}, this)" class="option-btn w-full text-right rounded-xl border border-gray-200 dark:border-neutral-600 hover:bg-gray-50 dark:hover:bg-neutral-700 transition-all font-medium text-gray-700 dark:text-gray-200 p-3 md:p-4 min-h-[4.5rem] flex items-center gap-3 overflow-hidden">
                        <span class="font-bold bg-gray-200 dark:bg-neutral-600 w-8 h-8 flex-shrink-0 inline-flex items-center justify-center rounded-full text-xs shadow-sm text-gray-700 dark:text-neutral-200">${i+1}</span>
                        <span class="${optSize} leading-snug whitespace-normal flex-grow">${opt}</span>
                    </button>`;
                }).join('')}</div>`;
            } else {
                return `<div class="max-w-xl mx-auto"><textarea id="essayInput" rows="4" class="w-full p-4 rounded-xl bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-600 focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-100 text-[13px] md:text-base focus:outline-none mb-4" placeholder="اكتب إجابتك هنا..."></textarea><button onclick="handleAnswer('essay')" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow transition-colors text-[14px] md:text-base">تحقق من الإجابة</button></div>`;
            }
        }

        function handleAnswer(type, selectedValue, btnElement) {
            const q = appState.questionsQueue[appState.currentIndex];
            const feedbackWrapper = document.getElementById('feedbackWrapper');
            const feedbackContent = document.getElementById('feedbackContent');
            let isCorrect = false;
            let statusType = '';

            if (type === 'mcq') {
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                if (selectedValue === q.correctAnswer) {
                    isCorrect = true; statusType = 'correct';
                    btnElement.className += ' bg-green-100 dark:bg-green-900/60 border-green-500 text-green-900 dark:text-green-100 shadow-md ring-2 ring-green-300 dark:ring-green-700 transform scale-[1.01] transition-transform'; 
                    btnElement.querySelector('span:first-child').className = 'font-bold bg-green-500 text-white w-8 h-8 flex-shrink-0 inline-flex items-center justify-center rounded-full text-xs shadow-sm';
                } else {
                    statusType = 'wrong';
                    btnElement.className += ' bg-red-100 dark:bg-red-900/60 border-red-500 text-red-900 dark:text-red-100 shadow-md ring-2 ring-red-300 dark:ring-red-700 transform scale-[1.01] transition-transform'; 
                    btnElement.querySelector('span:first-child').className = 'font-bold bg-red-500 text-white w-8 h-8 flex-shrink-0 inline-flex items-center justify-center rounded-full text-xs shadow-sm';
                    
                    const correctBtn = document.querySelectorAll('.option-btn')[q.correctAnswer];
                    if(correctBtn) {
                        correctBtn.className += ' bg-green-50 dark:bg-green-900/40 border-green-400 ring-1 ring-green-300';
                        correctBtn.querySelector('span:first-child').className = 'font-bold bg-green-400 text-white w-8 h-8 flex-shrink-0 inline-flex items-center justify-center rounded-full text-xs shadow-sm';
                    }
                }
            } 
            else if (type === 'essay') {
                const input = document.getElementById('essayInput');
                const userText = input.value.trim();
                input.disabled = true;
                if (!userText) { alert('اكتب إجابة!'); input.disabled = false; return; }

                const similarity = calculateSimilarity(userText, q.correctAnswer);
                const score = Math.round(similarity * 100);
                const settings = systemConfig.subjects[appState.currentSubject].grading;

                let feedbackText = "", feedbackClass = "", icon = "";

                if (score > settings.excellent) {
                    isCorrect = true; statusType = 'excellent';
                    feedbackText = "إجابة ممتازة";
                    feedbackClass = "bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800 text-green-700 dark:text-green-300";
                    icon = "fa-star";
                } else if (score > settings.passing) {
                    isCorrect = true; statusType = 'acceptable';
                    feedbackText = "إجابة مقبولة";
                    feedbackClass = "bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300";
                    icon = "fa-check";
                } else if (score > settings.incomplete) {
                    isCorrect = false; statusType = 'incomplete';
                    feedbackText = "إجابة ناقصة";
                    feedbackClass = "bg-yellow-50 dark:bg-yellow-900/20 border-yellow-200 dark:border-yellow-800 text-yellow-700 dark:text-yellow-300";
                    icon = "fa-triangle-exclamation";
                } else {
                    isCorrect = false; statusType = 'wrong';
                    feedbackText = "إجابة خاطئة";
                    feedbackClass = "bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-700 dark:text-red-300";
                    icon = "fa-xmark";
                }

                feedbackContent.innerHTML = `
                    <div class="font-bold text-[14px] md:text-lg mb-2 flex items-center gap-2 ${feedbackClass.split(' ').pop()}">
                        <i class="fa-solid ${icon}"></i> ${feedbackText}
                    </div>
                    <div class="mt-3 bg-white dark:bg-neutral-950 p-3 md:p-4 rounded-lg border border-gray-200 dark:border-neutral-700">
                        <span class="block text-[9px] md:text-xs text-gray-400 mb-1 font-bold">الإجابة النموذجية:</span>
                        <p class="text-[11px] md:text-sm text-gray-800 dark:text-neutral-200 leading-relaxed">${q.correctAnswer}</p>
                    </div>
                `;
                feedbackContent.className = `p-3 md:p-4 rounded-xl border ${feedbackClass}`;
                feedbackWrapper.classList.add('open');
            }

            playSound(statusType);
            appState.stats.totalAnswered++;
            if (isCorrect) appState.stats.correct++; else appState.stats.wrong++;

            const nextWrapper = document.getElementById('nextBtnWrapper');
            nextWrapper.classList.remove('hidden');
            
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.classList.remove('btn-appear');
            void nextBtn.offsetWidth; 
            nextBtn.classList.add('btn-appear');
        };

        function nextQuestion() {
            if (appState.currentIndex < appState.questionsQueue.length - 1) { showQuestion(appState.currentIndex + 1); } 
            else { finishQuiz(); }
        }

        function finishQuiz() {
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('resultsArea').classList.remove('hidden');
            const { correct, wrong, totalAnswered } = appState.stats;
            let percentage = totalAnswered > 0 ? (correct / totalAnswered) * 100 : 0;
            document.getElementById('resAnswered').innerText = totalAnswered;
            document.getElementById('resCorrect').innerText = correct;
            document.getElementById('resWrong').innerText = wrong;
            const percentText = document.getElementById('resPercentageText');
            percentText.innerText = percentage.toFixed(1) + '%';
            document.getElementById('resProgressBar').style.width = percentage + '%';
            if (percentage >= 85) percentText.className = "text-[28px] md:text-4xl font-bold text-green-600 dark:text-green-400";
            else if (percentage >= 50) percentText.className = "text-[28px] md:text-4xl font-bold text-yellow-600 dark:text-yellow-400";
            else percentText.className = "text-[28px] md:text-4xl font-bold text-red-600 dark:text-red-400";
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    </script>
</body>
</html>
